name: Create Release Branch

on:
  workflow_dispatch:

jobs:
  create-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Extract tag name
        id: tag
        run: |
          # workflow_dispatch로 선택한 ref가 태그인지 확인
          REF_NAME=${GITHUB_REF#refs/tags/}
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=$REF_NAME
          else
            echo "Error: Please select a tag, not a branch"
            exit 1
          fi
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "branch=release/${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Check if branch already exists
        id: check
        run: |
          if git ls-remote --heads origin ${{ steps.tag.outputs.branch }} | grep -q ${{ steps.tag.outputs.branch }}; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Create release branch from main
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          git checkout -b ${{ steps.tag.outputs.branch }}
          git push origin ${{ steps.tag.outputs.branch }}

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "⚠️ Branch ${{ steps.tag.outputs.branch }} already exists"
          else
            echo "✅ Created branch: ${{ steps.tag.outputs.branch }}"
          fi
